<style>
:root{ --bg:#F4F2EC; --card:#FFFFFF; --line:#E7E4DA; --ink:#26261F; --mut:#76746C; --hint:#A3A199; --teal:#0F6E56; --tealbg:#E1F5EE; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
.wrap{max-width:480px; margin:0 auto; min-height:100vh; padding:env(safe-area-inset-top) 0 0;}
.app{padding:14px 16px 96px;}
.sect{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:14px 16px; margin-bottom:12px;}
.h3{margin:0 0 10px; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--hint); font-weight:600;}
.nav{width:34px; height:34px; border-radius:11px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0;}
.headrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.headrow .mt{font-size:16px; font-weight:600;}

.dayhead{display:flex; align-items:flex-start; justify-content:space-between;}
.dayhead .dow{font-size:13px; color:var(--mut); margin:0;}
.dayhead .dt{font-size:28px; font-weight:600; margin:2px 0 0; line-height:1.05;}
.dayhead .pill{display:inline-block; margin-left:8px; font-size:11px; padding:3px 9px; border-radius:999px; background:var(--tealbg); color:var(--teal); vertical-align:middle;}
.dactions{display:flex; gap:8px; align-items:center;}

.sportbox{margin-top:14px; display:flex; gap:11px; align-items:center; border-radius:16px; padding:13px 14px;}
.sportbox .si{width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.sportbox .sl{font-size:11px; margin:0; opacity:.85;}
.sportbox .st{font-size:16px; font-weight:600; margin:2px 0 0;}

.strip{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 4px; scroll-behavior:smooth;}
.strip::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; width:46px; padding:8px 0; border-radius:14px; text-align:center; cursor:pointer; border:1px solid var(--line); background:var(--card);}
.chip.today:not(.sel){border-color:var(--teal);}
.chip.sel{background:var(--teal); border-color:var(--teal); color:#fff;}
.chip .cw{font-size:10px; color:var(--hint);}
.chip.sel .cw{color:#fff;}
.chip .cd{font-size:15px; font-weight:600; margin-top:1px;}
.chip .cdot{width:5px; height:5px; border-radius:50%; margin:3px auto 0;}

.slot{display:flex; gap:10px; align-items:flex-start;}
.stime{width:42px; flex-shrink:0; text-align:right; padding-top:12px; font-size:12px; color:var(--mut); font-variant-numeric:tabular-nums;}
.sgroup{flex:1; min-width:0; min-height:14px; display:flex; flex-direction:column; gap:8px; padding-bottom:8px;}
.tile{display:flex; gap:11px; align-items:center; border-radius:15px; padding:11px 12px; cursor:pointer; min-width:0; transition:opacity .15s; touch-action:pan-y;}
.tile.done{opacity:.4;}
.tile.done .tlabel{text-decoration:line-through;}
.tile.dragging{opacity:.6;}
.ticon{width:26px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.tbody{flex:1; min-width:0;}
.tlabel{font-size:14px; line-height:1.3;}
.tsub{font-size:11.5px; margin-top:2px; line-height:1.3; opacity:.8;}
.thandle{flex-shrink:0; padding:4px; touch-action:none; cursor:grab; display:flex; align-items:center; opacity:.55;}

.addbtn{margin-top:6px; width:100%; padding:11px; border-radius:14px; border:1px dashed var(--line); background:transparent; color:var(--teal); font-size:14px; font-weight:500; cursor:pointer; display:none; align-items:center; justify-content:center; gap:7px;}
.resetbtn{margin-top:8px; width:100%; padding:9px; border-radius:12px; border:none; background:transparent; color:var(--mut); font-size:13px; cursor:pointer; display:none; align-items:center; justify-content:center; gap:6px;}
body.editing .addbtn{display:flex;}
body.editing .resetbtn{display:flex;}
.hinttext{font-size:11.5px; color:var(--hint); text-align:center; margin:4px 0 0;}

.mealrow{display:flex; gap:11px; align-items:flex-start; border-radius:15px; padding:12px; margin-bottom:9px;}
.mealrow .mi{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.mealrow .ml{font-size:11px; color:var(--mut); margin:0;}
.mealrow .mn{font-size:14px; margin:2px 0 0;}
.mealrow .mg{font-size:11.5px; color:var(--mut); margin:4px 0 0; line-height:1.4;}
.btn{width:100%; padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--card); font-size:14px; font-weight:500; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:7px;}

.racecard{display:flex; gap:11px; align-items:center; border:1px solid var(--line); border-radius:15px; padding:11px 12px; margin-bottom:9px;}
.racecard .ri{width:34px; height:34px; border-radius:11px; background:#8077E5; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.racecard .rn{font-size:14px; font-weight:600; margin:0;}
.racecard .rd{font-size:12px; color:var(--mut); margin:2px 0 0;}
.tlist .ti2{display:flex; gap:10px; padding:7px 0; font-size:13.5px; align-items:baseline;}
.tlist .ti2+.ti2{border-top:1px solid var(--line);}
.tlist .td{width:62px; flex-shrink:0; color:var(--mut); font-size:12px;}
.exlist li{font-size:13.5px; padding:5px 0; line-height:1.4;}
.exlist{margin:0; padding-left:18px;}

.grid7{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center;}
.dow7{font-size:11px; color:var(--hint); padding:3px 0;}
.cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; border:1.5px solid transparent; cursor:pointer; font-size:14px; gap:3px;}
.cell.today{border-color:var(--teal);}
.cell.sel{background:var(--teal); color:#fff; border-color:var(--teal);}
.cell .cdot{width:5px; height:5px; border-radius:50%;}
.tabbar{position:fixed; left:0; right:0; bottom:0; background:#fffffff2; backdrop-filter:saturate(180%) blur(8px); border-top:1px solid var(--line); display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--hint); cursor:pointer; background:none; border:none; font-family:inherit;}
.tab span{font-size:10px;}
.tab.on{color:var(--teal);}

.overlay{position:fixed; inset:0; background:#0008; display:none; align-items:flex-end; justify-content:center; z-index:50;}
.overlay.show{display:flex;}
.modal{background:var(--card); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
.modal h4{margin:0 0 14px; font-size:17px; font-weight:600;}
.fld{margin-bottom:12px;}
.fld label{display:block; font-size:12px; color:var(--mut); margin-bottom:5px;}
.fld input,.fld select{width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--line); font-size:15px; font-family:inherit; background:var(--bg); color:var(--ink);}
.mbtns{display:flex; gap:9px; margin-top:6px;}
.mbtns button{flex:1; padding:12px; border-radius:13px; border:none; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;}
.save{background:var(--teal); color:#fff;}
.cancel{background:var(--bg); color:var(--ink);}
.del{background:#FCEBEB; color:#A32D2D;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="app">

    <div id="viewMain">
      <div class="sect">
        <div class="dayhead">
          <div class="dd">
            <p class="dow" id="hDow">–</p>
            <p class="dt"><span id="hDate">–</span><span class="pill hidden" id="hPill">Heute</span></p>
          </div>
          <div class="dactions">
            <div class="nav" id="prevDay"></div>
            <div class="nav" id="nextDay"></div>
            <div class="nav" id="editBtn" title="Bearbeiten"></div>
          </div>
        </div>
        <div id="hSport"></div>
      </div>

      <div class="sect">
        <div class="headrow">
          <div class="nav" id="prevMonth"></div>
          <span class="mt" id="stripMonth">–</span>
          <div class="nav" id="nextMonth"></div>
        </div>
        <div class="strip" id="strip"></div>
      </div>

      <div class="sect">
        <div id="timeline"></div>
        <button class="addbtn" id="addBtn"></button>
        <button class="resetbtn" id="resetBtn"></button>
      </div>
    </div>

    <div id="viewCal" class="hidden">
      <div class="sect">
        <div class="headrow">
          <div class="nav" id="prevCal"></div>
          <span class="mt" id="calTitle">–</span>
          <div class="nav" id="nextCal"></div>
        </div>
        <div class="grid7" style="margin-bottom:5px;">
          <span class="dow7">Mo</span><span class="dow7">Di</span><span class="dow7">Mi</span><span class="dow7">Do</span><span class="dow7">Fr</span><span class="dow7">Sa</span><span class="dow7">So</span>
        </div>
        <div class="grid7" id="calGrid"></div>
      </div>
    </div>

    <div id="viewTraining" class="hidden">
      <div class="sect">
        <p class="h3">Nächste Wettkämpfe</p>
        <div id="raceList"></div>
      </div>
      <div class="sect">
        <div class="headrow">
          <div class="nav" id="prevTMonth"></div>
          <span class="mt" id="tMonthTitle">–</span>
          <div class="nav" id="nextTMonth"></div>
        </div>
        <div class="tlist" id="trainList"></div>
      </div>
      <div class="sect">
        <p class="h3">Hüftaktivierung · bei jeder Fitti-Einheit</p>
        <ul class="exlist" id="exList"></ul>
      </div>
    </div>

    <div id="viewMeals" class="hidden">
      <div class="sect">

let now=new Date();

function load(k,def){ try{ return localStorage.getItem(k) ?? def; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function getOv(){ try{ return JSON.parse(localStorage.getItem('mt_ov')||'{}'); }catch(e){ return {}; } }
function setOv(o){ save('mt_ov',JSON.stringify(o)); }
function key(m,d){ return YEAR+'-'+m+'-'+d; }
function meal(c,d){ const a=MEALS[c]; return a[((d-1)+mealOffset)%a.length]; }
function slotOf(t){ let s=0; for(let i=0;i<SLOTS.length;i++){ if(t>=SLOTS[i]) s=i; } return s; }

function classify(act,m){
  const r={items:[],remMorgen:false,remMittag:false,remAbend:false,fitti:false,rest:false};
  if(/^frei/i.test(act)){ r.rest=true; if(/biken/i.test(act)) r.items.push({t:'14:00',l:'Biken Borderline',c:'sport',sub:'ab 14:00'}); return r; }
  const summer=m>=4&&m<=9, fila=/fila/i.test(act);
  if(/^[A-ZÄÖÜ]{3,}/.test(act)&&/km|k\b/i.test(act)){ r.items.push({t:'09:30',l:act,c:'race',sub:'Startzeit noch offen'}); return r; }
  if(/fitti/i.test(act)){ r.fitti=true; r.items.push({t:'13:00',l:act,c:'fitti',sub:'13:00–14:00'}); return r; }
  if(/beach|community/i.test(act)){ r.items.push({t:'18:00',l:act,c:'beach',sub:'ab 18:00'}); return r; }
  if(/agilit|agi /i.test(act)){
    r.remAbend=true;
    if(/^agility /i.test(act)){ r.items.push({t:'10:00',l:act,c:'agilityW',sub:'Turnier · Zeit noch offen'}); }
    else {
      const al=/^nur agility/i.test(act)?act:'Agility mit Fila';
      r.items.push({t:'17:30',l:al+' (16–18 Uhr)',c:'agilityT'});
      if(/easy/i.test(act)) r.items.push({t:'20:30',l:'Easy Lauf',c:'sport',sub:'ab 20:30'});
    }
    return r;
  }
  const isLong=/long/i.test(act), isBerg=/berg|hügel/i.test(act);
  if(fila){
    if(summer){ r.remMorgen=true; r.items.push({t:'07:45',l:act,c:isBerg?'berg':'sport',sub:'ab 07:45'}); }
    else { r.remMittag=true; r.items.push({t:'12:30',l:act,c:isBerg?'berg':'sport',sub:'ab 12:30'}); }
    return r;
  }
  const tt=isLong?'09:30':'18:00';
  r.items.push({t:tt,l:act,c:isBerg?'berg':'sport',sub:'ab '+tt});
  return r;
}

function buildFlat(m,d){
  const dow=new Date(YEAR,m-1,d).getDay(), weekend=dow===0||dow===6;
  const act=(PLAN[m]||{})[d]||null;
  const c=act?classify(act,m):{items:[],remMorgen:false,remMittag:false,remAbend:false,fitti:false,rest:false};
  const fr=meal('fr',d), mi=meal('mi',d), ab=meal('ab',d);
  const comp=c.items.find(x=>x.c==='race'||x.c==='agilityW');
  if(comp){ return [{t:'09:00',l:'Frühstück: Toast mit Erdnussbutter & Marmelade',c:'essen'}, comp]; }
  let it=[];
  it.push({t:'07:30',l:'Aufstehen',c:'aufstehen'});
  if(!c.remMorgen) it.push({t:'07:45',l:'Morgenrunde mit Fila',c:'fila'});
  it.push({t:'09:00',l:'Frühstück: '+fr.n,c:'essen'});
  if(!weekend) it.push({t:'09:15',l:'Deep Work – Vormittag',c:'deepwork'});
  if(!c.remMittag) it.push({t:'12:30',l:'Mittagsrunde mit Fila',c:'fila'});
  it.push({t:'14:00',l:'Mittagessen: '+mi.n,c:'essen'});
  if(!weekend) it.push({t:'14:31',l:'Arbeiten – Nachmittag',c:'arbeit'});
  if(!c.remAbend) it.push({t:'17:30',l:'Abendrunde mit Fila',c:'fila'});
  it.push({t:'19:30',l:'Abendessen: '+ab.n,c:'essen'});
  it.push({t:'23:00',l:'Schlafenszeit',c:'schlaf'});
  c.items.forEach(x=> it.push(x));
  it.sort((a,b)=> a.t.localeCompare(b.t));
  return it;
}
function genGroups(m,d){ const flat=buildFlat(m,d); const g=SLOTS.map(()=>[]); flat.forEach(it=> g[slotOf(it.t)].push(it)); return g; }
function effective(m,d){ const ov=getOv(),k=key(m,d); return ov[k]?ov[k]:genGroups(m,d); }
function ensureOv(m,d){ const ov=getOv(),k=key(m,d); if(!ov[k]){ ov[k]=genGroups(m,d); setOv(ov); } return ov; }

function sportSummary(m,d){
  const act=(PLAN[m]||{})[d]; if(!act) return null;
  if(/^frei/i.test(act)) return {rest:true,label:'Trainingsfrei – Ruhetag',cat:'frei'};
  const c=classify(act,m); const main=c.items.find(x=>x.c!=='essen')||c.items[0];
  if(!main) return null;
  return {rest:false,label:act,cat:main.c,time:main.t};
}
function fmtDate(m,d){ return d+'. '+MON[m-1]; }
function isToday(m,d){ return now.getFullYear()===YEAR&&now.getMonth()+1===m&&now.getDate()===d; }
function isSel(m,d){ return cur.m===m&&cur.d===d; }

function renderStrip(){
  document.getElementById('stripMonth').textContent=MON[viewMonth-1]+' '+YEAR;
  const s=document.getElementById('strip'); s.innerHTML='';
  const dim=new Date(YEAR,viewMonth,0).getDate();
  for(let d=1;d<=dim;d++){
    const dt=new Date(YEAR,viewMonth-1,d), ss=sportSummary(viewMonth,d);
    const chip=document.createElement('div');
    chip.className='chip'+(isSel(viewMonth,d)?' sel':'')+(isToday(viewMonth,d)&&!isSel(viewMonth,d)?' today':'');
    const dotc=ss&&!ss.rest?(CAT[ss.cat]||CAT.sonstiges).bg:'transparent';
    chip.innerHTML='<div class="cw">'+DOWS[dt.getDay()]+'</div><div class="cd">'+d+'</div><div class="cdot" style="background:'+dotc+'"></div>';
    chip.addEventListener('click',()=>{ cur={m:viewMonth,d:d}; renderStrip(); renderDay(); });
    s.appendChild(chip);
  }
  const sel=s.querySelector('.chip.sel'); if(sel) sel.scrollIntoView({inline:'center',block:'nearest'});
}

let uidMap={}, uidC=0;
function renderDay(){
  document.getElementById('hDow').textContent=DOW[new Date(YEAR,cur.m-1,cur.d).getDay()];
  document.getElementById('hDate').textContent=fmtDate(cur.m,cur.d);
  document.getElementById('hPill').classList.toggle('hidden',!isToday(cur.m,cur.d));

  const ss=sportSummary(cur.m,cur.d), hs=document.getElementById('hSport');
  if(ss){ const cc=CAT[ss.cat];
    const badge=ss.rest?'Heute':(ss.cat==='race'?'Wettkampf':ss.cat==='agilityW'?'Turnier':'Training'+(ss.time?' '+ss.time:''));
    hs.innerHTML='<div class="sportbox" style="background:'+cc.bg+'; color:'+cc.fg+'"><div class="si">'+svg(cc.ic,cc.fg,20)+'</div>'+
      '<div><p class="sl">'+badge+'</p><p class="st">'+ss.label+'</p></div></div>';
  } else hs.innerHTML='';

  const groups=effective(cur.m,cur.d), tl=document.getElementById('timeline'); tl.innerHTML='';
  uidMap={}; uidC=0;
  groups.forEach((g,si)=>{
    const slot=document.createElement('div'); slot.className='slot';
    const st=document.createElement('div'); st.className='stime'; st.textContent=SLOTS[si];
    const sg=document.createElement('div'); sg.className='sgroup'; sg.dataset.slot=si;
    g.forEach((it,ii)=>{
      const cc=CAT[it.c]||CAT.sonstiges;
      const uid=uidC++; uidMap[uid]=it;
      const tile=document.createElement('div'); tile.className='tile'+(it.done?' done':'');
      tile.style.background=cc.bg; tile.style.color=cc.fg; tile.dataset.uid=uid; tile.dataset.slot=si; tile.dataset.idx=ii;
      tile.innerHTML='<div class="ticon">'+svg(cc.ic,cc.fg,18)+'</div>'+
        '<div class="tbody"><div class="tlabel">'+it.l+'</div>'+(it.sub?'<div class="tsub">'+it.sub+'</div>':'')+'</div>'+
        '<div class="thandle">'+svg('grip',cc.fg,20)+'</div>';
      const handle=tile.querySelector('.thandle');
      tile.addEventListener('click',()=>{ if(window._sup){window._sup=false;return;} toggleDone(+tile.dataset.slot,+tile.dataset.idx); });
      handle.addEventListener('click',e=>e.stopPropagation());
      handle.addEventListener('pointerdown',e=>onHandleDown(e,tile));
      sg.appendChild(tile);
    });
    slot.appendChild(st); slot.appendChild(sg); tl.appendChild(slot);
  });
}

function toggleDone(si,ii){ const ov=ensureOv(cur.m,cur.d),k=key(cur.m,cur.d); ov[k][si][ii].done=!ov[k][si][ii].done; setOv(ov); renderDay(); }

let drag={el:null,moved:false,active:false,startY:0};
function onHandleDown(e,tile){
  e.preventDefault(); e.stopPropagation();
  drag.el=tile; drag.moved=false; drag.active=false; drag.startY=e.clientY;
  window.addEventListener('pointermove',onPMove);
  window.addEventListener('pointerup',onPUp,{once:true});
}
function onPMove(e){
  if(!drag.el) return;
  if(!drag.active){ if(Math.abs(e.clientY-drag.startY)<8) return; drag.active=true; drag.el.classList.add('dragging'); }
  e.preventDefault(); drag.moved=true;
  const sgs=[...document.querySelectorAll('.sgroup')]; let target=null;
  for(const g of sgs){ const r=g.getBoundingClientRect(); if(e.clientY>=r.top-6&&e.clientY<=r.bottom+6){ target=g; break; } }
  if(!target){ let best=null; sgs.forEach(g=>{ const r=g.getBoundingClientRect(); const dst=Math.abs(e.clientY-(r.top+r.bottom)/2); if(!best||dst<best.d) best={g,d:dst}; }); target=best.g; }
  const rows=[...target.querySelectorAll('.tile')].filter(r=>r!==drag.el); let ref=null;
  for(const r of rows){ const rect=r.getBoundingClientRect(); if(e.clientY<rect.top+rect.height/2){ ref=r; break; } }
  if(ref) target.insertBefore(drag.el,ref); else target.appendChild(drag.el);
}
function onPUp(){
  window.removeEventListener('pointermove',onPMove);
  if(!drag.el) return;
  const tile=drag.el;
  tile.classList.remove('dragging');
  if(drag.active&&drag.moved){ commitOrder(); window._sup=true; setTimeout(()=>window._sup=false,350); }
  else { openModal(+tile.dataset.slot,+tile.dataset.idx); }
  drag.el=null; drag.active=false;
}
function commitOrder(){
  const sgs=[...document.querySelectorAll('.sgroup')];
  const ng=sgs.map(g=> [...g.querySelectorAll('.tile')].map(t=> uidMap[t.dataset.uid]));
  const ov=getOv(); ov[key(cur.m,cur.d)]=ng; setOv(ov); renderDay();
}

let editSlot=-1, editIdx=-1;
function openModal(si,ii){
  editSlot=si; editIdx=ii; ensureOv(cur.m,cur.d);
  document.getElementById('modalTitle').textContent=ii>=0?'Aktivität bearbeiten':'Aktivität hinzufügen';
  document.getElementById('mDel').classList.toggle('hidden',ii<0);
  if(ii>=0){ const it=getOv()[key(cur.m,cur.d)][si][ii];
    document.getElementById('fLabel').value=it.l; document.getElementById('fTime').value=it.t||SLOTS[si]; document.getElementById('fCat').value=it.c||'sonstiges';
  } else { document.getElementById('fLabel').value=''; document.getElementById('fTime').value='12:00'; document.getElementById('fCat').value='sonstiges'; }
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('mSave').addEventListener('click',()=>{
  const ov=ensureOv(cur.m,cur.d), k=key(cur.m,cur.d);
  const t=document.getElementById('fTime').value||'12:00';
  const item={t:t,l:document.getElementById('fLabel').value.trim()||'Aktivität',c:document.getElementById('fCat').value};
  if(editIdx>=0){ const old=ov[k][editSlot][editIdx]; item.done=old.done; item.sub=old.sub; ov[k][editSlot][editIdx]=item; }
  else { const si=slotOf(t); ov[k][si].push(item); ov[k][si].sort((a,b)=>(a.t||'').localeCompare(b.t||'')); }
  setOv(ov); closeModal(); renderDay();
});
document.getElementById('mDel').addEventListener('click',()=>{ const ov=ensureOv(cur.m,cur.d),k=key(cur.m,cur.d); if(editIdx>=0){ ov[k][editSlot].splice(editIdx,1); setOv(ov); } closeModal(); renderDay(); });
document.getElementById('mCancel').addEventListener('click',closeModal);
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });

document.getElementById('addBtn').addEventListener('click',()=>openModal(0,-1));
document.getElementById('resetBtn').addEventListener('click',()=>{ const ov=getOv(); delete ov[key(cur.m,cur.d)]; setOv(ov); renderDay(); });
document.getElementById('editBtn').addEventListener('click',function(){ document.body.classList.toggle('editing');
  const on=document.body.classList.contains('editing');
  this.style.background=on?'var(--teal)':'var(--card)'; this.innerHTML=svg('pencil',on?'#fff':'#26261F',18);
});
document.getElementById('prevDay').addEventListener('click',()=>shiftDay(-1));
document.getElementById('nextDay').addEventListener('click',()=>shiftDay(1));
function shiftDay(n){ const dt=new Date(YEAR,cur.m-1,cur.d+n); cur={m:dt.getMonth()+1,d:dt.getDate()}; viewMonth=cur.m; renderStrip(); renderDay(); }
document.getElementById('prevMonth').addEventListener('click',()=>{ if(viewMonth>1){viewMonth--; renderStrip();} });
document.getElementById('nextMonth').addEventListener('click',()=>{ if(viewMonth<12){viewMonth++; renderStrip();} });

function renderTraining(){
  const rl=document.getElementById('raceList'); rl.innerHTML='';
  RACES.forEach(r=>{ const e=document.createElement('div'); e.className='racecard';
    e.innerHTML='<div class="ri">'+svg('trophy','#ffffff',18)+'</div><div><p class="rn">'+r.n+'</p><p class="rd">'+r.w+', '+r.d+' · '+r.info+'</p></div>'; rl.appendChild(e); });
  document.getElementById('tMonthTitle').textContent='Training · '+MON[tMonth-1];
  const tlst=document.getElementById('trainList'); tlst.innerHTML='';
  const pm=PLAN[tMonth]||{}; const days=Object.keys(pm).map(Number).sort((a,b)=>a-b); let any=false;
  days.forEach(d=>{ const act=pm[d]; if(/^frei/i.test(act)) return; any=true;
    const row=document.createElement('div'); row.className='ti2';
    row.innerHTML='<span class="td">'+DOWS[new Date(YEAR,tMonth-1,d).getDay()]+' '+d+'.</span><span>'+act+'</span>'; tlst.appendChild(row); });
  if(!any) tlst.innerHTML='<p class="hinttext">Kein Training in diesem Monat hinterlegt.</p>';
  const ex=document.getElementById('exList'); ex.innerHTML=''; HUEFT.forEach(h=>{ const li=document.createElement('li'); li.textContent=h; ex.appendChild(li); });
}
document.getElementById('prevTMonth').addEventListener('click',()=>{ if(tMonth>1){tMonth--; renderTraining();} });
document.getElementById('nextTMonth').addEventListener('click',()=>{ if(tMonth<12){tMonth++; renderTraining();} });

let calMonth=cur.m;
function renderCal(){
  document.getElementById('calTitle').textContent=MON[calMonth-1]+' '+YEAR;
  const g=document.getElementById('calGrid'); g.innerHTML='';
  const first=(new Date(YEAR,calMonth-1,1).getDay()+6)%7, dim=new Date(YEAR,calMonth,0).getDate();
  for(let i=0;i<first;i++) g.appendChild(document.createElement('span'));
  for(let d=1;d<=dim;d++){
    const ss=sportSummary(calMonth,d);
    const cell=document.createElement('div');
    cell.className='cell'+(isSel(calMonth,d)?' sel':'')+(isToday(calMonth,d)&&!isSel(calMonth,d)?' today':'');
    const dotc=ss&&!ss.rest?(CAT[ss.cat]||CAT.sonstiges).bg:'transparent';
    cell.innerHTML='<span>'+d+'</span><span class="cdot" style="background:'+dotc+'"></span>';
    cell.addEventListener('click',()=>{ cur={m:calMonth,d:d}; viewMonth=calMonth; switchView('Main'); });
    g.appendChild(cell);
  }
}
document.getElementById('prevCal').addEventListener('click',()=>{ if(calMonth>1){calMonth--; renderCal();} });
document.getElementById('nextCal').addEventListener('click',()=>{ if(calMonth<12){calMonth++; renderCal();} });

function renderMeals(){
  const ml=document.getElementById('mealList'); ml.innerHTML='';
  const defs=[['Frühstück','fr','#FAEEDA','#854F0B','sunrise'],['Mittag','mi','#EAF3DE','#3B6D11','bowl'],['Abend','ab','#E6F1FB','#0C447C','moon']];
  defs.forEach(x=>{ const m=meal(x[1],cur.d); const e=document.createElement('div'); e.className='mealrow'; e.style.background=x[2]+'55';
    e.innerHTML='<div class="mi" style="background:'+x[2]+'">'+svg(x[4],x[3],16)+'</div><div><p class="ml">'+x[0]+'</p><p class="mn">'+m.n+'</p><p class="mg">'+m.g+'</p></div>'; ml.appendChild(e); });
}
document.getElementById('rotateBtn').addEventListener('click',()=>{ mealOffset++; save('mt_mealoffset',String(mealOffset)); renderMeals(); renderDay(); });

function switchView(v){
  document.getElementById('viewMain').classList.toggle('hidden',v!=='Main');
  document.getElementById('viewTraining').classList.toggle('hidden',v!=='Training');
  document.getElementById('viewCal').classList.toggle('hidden',v!=='Cal');
  document.getElementById('viewMeals').classList.toggle('hidden',v!=='Meals');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  if(v==='Main'){ renderStrip(); renderDay(); }
  if(v==='Training'){ tMonth=cur.m; renderTraining(); }
  if(v==='Cal'){ calMonth=cur.m; renderCal(); }
  if(v==='Meals') renderMeals();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.v)));

function initIcons(){
  document.getElementById('prevMonth').innerHTML=svg('chevL','#26261F',18);
  document.getElementById('nextMonth').innerHTML=svg('chevR','#26261F',18);
  document.getElementById('prevDay').innerHTML=svg('chevL','#26261F',18);
  document.getElementById('nextDay').innerHTML=svg('chevR','#26261F',18);
  document.getElementById('editBtn').innerHTML=svg('pencil','#26261F',18);
  document.getElementById('prevTMonth').innerHTML=svg('chevL','#26261F',18);
  document.getElementById('nextTMonth').innerHTML=svg('chevR','#26261F',18);
  document.getElementById('prevCal').innerHTML=svg('chevL','#26261F',18);
  document.getElementById('nextCal').innerHTML=svg('chevR','#26261F',18);
  document.getElementById('addBtn').innerHTML=svg('plus','#0F6E56',18)+' Aktivität hinzufügen';
  document.getElementById('resetBtn').innerHTML=svg('reset','#76746C',16)+' Tag auf Plan zurücksetzen';
  document.getElementById('rotateBtn').innerHTML=svg('refresh','#26261F',16)+' Andere Vorschläge';
  const tic=document.querySelectorAll('.tab .tabic');
  tic[0].innerHTML=svg('list','currentColor',21); tic[1].innerHTML=svg('run','currentColor',21); tic[2].innerHTML=svg('month','currentColor',21); tic[3].innerHTML=svg('salad','currentColor',21);
}

initIcons(); renderStrip(); renderDay();
</script>
